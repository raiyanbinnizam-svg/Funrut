<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>67 · Truth or Dare</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --pink: #ff5fa2;
    --orange: #ff9f1c;
    --yellow: #ffd23f;
    --green: #3ddc97;
    --blue: #3bc9ff;
    --purple: #9b5de5;
    --ink: #3a2a5c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Fredoka", "Comic Sans MS", "Trebuchet MS", sans-serif;
    color: var(--ink);
    background:
      radial-gradient(circle at 10% 15%, #ffe3f1 0 12%, transparent 13%),
      radial-gradient(circle at 90% 25%, #e0f7ff 0 10%, transparent 11%),
      radial-gradient(circle at 15% 85%, #fff4c7 0 11%, transparent 12%),
      radial-gradient(circle at 88% 80%, #e6ffef 0 12%, transparent 13%),
      #fff8fd;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px 16px 40px;
    overflow-x: hidden;
  }

  h1 {
    margin: 8px 0 0;
    font-size: clamp(3rem, 14vw, 4.5rem);
    line-height: 1;
    letter-spacing: 2px;
  }
  h1 span:nth-child(1) { color: var(--pink); }
  h1 span:nth-child(2) { color: var(--blue); }
  .tagline { margin: 4px 0 18px; font-size: 1.2rem; font-weight: 500; }

  .turn {
    background: #fff;
    border: 3px solid var(--ink);
    border-radius: 999px;
    padding: 8px 20px;
    font-size: 1.25rem;
    font-weight: 700;
    box-shadow: 0 4px 0 var(--ink);
    margin-bottom: 20px;
    text-align: center;
  }

  .wheel-wrap {
    position: relative;
    width: min(420px, calc(100vw - 48px));
    aspect-ratio: 1;
  }
  .pointer {
    position: absolute;
    top: -14px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 44px;
    line-height: 1;
    z-index: 3;
    filter: drop-shadow(0 3px 0 var(--ink));
  }
  #wheel {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    border: 6px solid var(--ink);
    box-shadow: 0 8px 0 var(--ink);
    transition: transform 4s cubic-bezier(.15,.75,.15,1);
  }
  .hub {
    position: absolute;
    top: 50%; left: 50%;
    width: 30%;
    aspect-ratio: 1;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    border: 6px solid var(--ink);
    background: var(--yellow);
    color: var(--ink);
    font-family: inherit;
    font-size: clamp(2.2rem, 11vw, 3.6rem);
    font-weight: 700;
    cursor: pointer;
    z-index: 2;
    box-shadow: 0 5px 0 var(--ink);
    animation: bounce 1.6s ease-in-out infinite;
  }
  .hub:disabled { animation: none; cursor: default; }
  .hub:focus-visible { outline: 4px dashed var(--pink); outline-offset: 6px; }
  @keyframes bounce {
    0%, 100% { transform: translate(-50%, -50%) scale(1); }
    50% { transform: translate(-50%, -50%) scale(1.08); }
  }
  .tap { margin: 18px 0 0; font-size: 1.1rem; font-weight: 500; }

  .btn {
    font-family: inherit;
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--ink);
    border: 3px solid var(--ink);
    border-radius: 999px;
    padding: 10px 22px;
    cursor: pointer;
    box-shadow: 0 4px 0 var(--ink);
    transition: transform .08s;
  }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }

  /* players */
  .players {
    margin-top: 28px;
    width: min(420px, 100%);
    background: #fff;
    border: 3px solid var(--ink);
    border-radius: 24px;
    padding: 16px;
    box-shadow: 0 6px 0 var(--ink);
  }
  .players h2 { margin: 0 0 10px; font-size: 1.3rem; text-align: center; }
  .add { display: flex; gap: 8px; }
  .add input {
    flex: 1;
    min-width: 0;
    font-family: inherit;
    font-size: 1.1rem;
    padding: 10px 14px;
    border: 3px solid var(--ink);
    border-radius: 999px;
    color: var(--ink);
  }
  .add input:focus { outline: none; border-color: var(--pink); }
  .add .btn { background: var(--green); padding: 8px 18px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; justify-content: center; }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 8px 6px 14px;
    border: 3px solid var(--ink);
    border-radius: 999px;
    font-weight: 700;
    font-size: 1.05rem;
  }
  .chip.now { outline: 4px solid var(--yellow); outline-offset: 2px; }
  .chip button {
    font-family: inherit;
    border: 0;
    background: rgba(255,255,255,.7);
    border-radius: 50%;
    width: 24px; height: 24px;
    font-weight: 700;
    cursor: pointer;
    color: var(--ink);
    line-height: 1;
  }
  .none { text-align: center; margin: 12px 0 0; opacity: .7; }

  /* result card */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(58, 42, 92, .45);
    display: grid; place-items: center;
    padding: 16px;
    z-index: 10;
    opacity: 0; pointer-events: none;
    transition: opacity .2s;
  }
  .overlay.open { opacity: 1; pointer-events: auto; }
  .card {
    width: min(400px, 100%);
    border: 4px solid var(--ink);
    border-radius: 28px;
    padding: 24px 20px 22px;
    text-align: center;
    box-shadow: 0 8px 0 var(--ink);
    transform: scale(.6) rotate(-6deg);
    transition: transform .35s cubic-bezier(.2,1.6,.4,1);
  }
  .overlay.open .card { transform: scale(1) rotate(0); }
  .card.truth { background: var(--blue); }
  .card.dare { background: var(--pink); }
  .card .emoji { font-size: 3.6rem; line-height: 1; }
  .card .kind { margin: 6px 0 0; font-size: 2.6rem; font-weight: 700; color: #fff; text-shadow: 0 3px 0 var(--ink); }
  .card .who { margin: 2px 0 14px; font-size: 1.15rem; font-weight: 500; color: #fff; }
  .card .prompt {
    background: #fff;
    border: 3px solid var(--ink);
    border-radius: 20px;
    padding: 16px;
    font-size: 1.3rem;
    font-weight: 500;
    margin: 0 0 18px;
  }
  .card .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .card .done { background: var(--yellow); }
  .card .again { background: #fff; }

  .confetti {
    position: fixed;
    top: -20px;
    width: 12px; height: 16px;
    border-radius: 3px;
    z-index: 20;
    pointer-events: none;
    animation: fall linear forwards;
  }
  @keyframes fall {
    to { transform: translateY(110vh) rotate(720deg); }
  }
</style>
</head>
<body>
  <h1><span>6</span><span>7</span></h1>
  <p class="tagline">Truth or Dare 🎉</p>

  <div class="turn" id="turn" aria-live="polite">Tap 67 to spin!</div>

  <div class="wheel-wrap">
    <div class="pointer" aria-hidden="true">🔻</div>
    <canvas id="wheel" width="840" height="840" aria-label="Truth or Dare wheel"></canvas>
    <button class="hub" id="hub" type="button" aria-label="Spin">67</button>
  </div>
  <p class="tap">👆 Tap the 67 to spin</p>

  <section class="players">
    <h2>Who's playing? 🙋</h2>
    <form class="add" id="addForm">
      <input id="name" type="text" placeholder="Type a name" maxlength="20" autocomplete="off">
      <button class="btn" type="submit">Add</button>
    </form>
    <div class="chips" id="chips"></div>
    <p class="none" id="none">Add your friends, or just spin!</p>
  </section>

  <div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="kind">
    <div class="card" id="card">
      <div class="emoji" id="emoji">🤔</div>
      <p class="kind" id="kind">TRUTH!</p>
      <p class="who" id="who"></p>
      <p class="prompt" id="prompt"></p>
      <div class="actions">
        <button class="btn done" id="done" type="button">Done! 🎉</button>
        <button class="btn again" id="again" type="button">Another one 🔄</button>
      </div>
    </div>
  </div>

<script>
(() => {
  const TRUTHS = [
    'What is the most embarrassing thing that ever happened to you?',
    'What is your weirdest habit?',
    'Who in this room would you swap lives with for a day?',
    'What is the silliest thing you ever cried about?',
    'What is the last lie you told?',
    'What song do you secretly love?',
    'Have you ever pretended to be sick to skip something?',
    'What food do you hate but eat anyway?',
    'What is the most childish thing you still do?',
    'If you were invisible for a day, what would you do?',
    'What is the worst gift you ever got?',
    'Who was your first celebrity crush?',
    'What is your most useless talent?',
    'What is the funniest thing you have ever seen?',
    'If you could only eat one food forever, what would it be?',
    'Who here makes you laugh the most?',
  ];
  const DARES = [
    'Do your best impression of someone here.',
    'Talk in a funny accent until your next turn.',
    'Do 10 jumping jacks while shouting "67!"',
    'Sing the chorus of your favourite song.',
    'Speak only in questions until your next turn.',
    'Show us your best dance move for 20 seconds.',
    'Balance a spoon on your nose for 10 seconds.',
    'Say the alphabet backwards as fast as you can.',
    'Make up a rap about the person next to you.',
    'Act like a chicken until someone laughs.',
    'Hold a plank for 30 seconds.',
    'Tell a joke. If nobody laughs, tell another one!',
    'Do the "67" hand move for 10 seconds.',
    'Draw a self-portrait with your eyes closed.',
    'Walk like a model across the room.',
    'Pull your funniest face and hold it for 10 seconds.',
  ];

  // Candy-coloured slices, alternating Truth and Dare.
  const SLICES = [
    { kind: 'truth', color: '#3bc9ff' },
    { kind: 'dare', color: '#ff5fa2' },
    { kind: 'truth', color: '#3ddc97' },
    { kind: 'dare', color: '#ff9f1c' },
    { kind: 'truth', color: '#9b5de5' },
    { kind: 'dare', color: '#ffd23f' },
    { kind: 'truth', color: '#3bc9ff' },
    { kind: 'dare', color: '#ff5fa2' },
  ];
  const SLICE_DEG = 360 / SLICES.length;
  const SPIN_MS = 4000;

  const $ = (id) => document.getElementById(id);
  const canvas = $('wheel');
  const ctx = canvas.getContext('2d');
  const hub = $('hub');
  const overlay = $('overlay');

  let players = [];
  try { players = JSON.parse(localStorage.getItem('67-players')) || []; } catch {}
  let turn = 0;
  function savePlayers() {
    try { localStorage.setItem('67-players', JSON.stringify(players)); } catch {}
  }

  // ---------- wheel ----------
  function drawWheel() {
    const size = canvas.width;
    const c = size / 2;
    const r = c;
    ctx.clearRect(0, 0, size, size);
    SLICES.forEach((slice, i) => {
      // Slice 0 starts at the top, under the pointer, and goes clockwise.
      const start = -Math.PI / 2 + (i * SLICE_DEG * Math.PI) / 180;
      const end = start + (SLICE_DEG * Math.PI) / 180;
      ctx.beginPath();
      ctx.moveTo(c, c);
      ctx.arc(c, c, r, start, end);
      ctx.closePath();
      ctx.fillStyle = slice.color;
      ctx.fill();
      ctx.lineWidth = 8;
      ctx.strokeStyle = '#3a2a5c';
      ctx.stroke();

      ctx.save();
      ctx.translate(c, c);
      ctx.rotate((start + end) / 2);
      ctx.textAlign = 'right';
      ctx.textBaseline = 'middle';
      ctx.font = `700 ${Math.round(size * 0.06)}px Fredoka, "Comic Sans MS", sans-serif`;
      ctx.lineWidth = 10;
      ctx.strokeStyle = '#3a2a5c';
      ctx.fillStyle = '#fff';
      const label = slice.kind === 'truth' ? 'TRUTH' : 'DARE';
      ctx.strokeText(label, r - size * 0.06, 0);
      ctx.fillText(label, r - size * 0.06, 0);
      ctx.restore();
    });
  }

  // ---------- spin ----------
  let rotation = 0;
  let spinning = false;

  function spin() {
    if (spinning) return;
    spinning = true;
    hub.disabled = true;

    const index = Math.floor(Math.random() * SLICES.length);
    const wiggle = (Math.random() - 0.5) * SLICE_DEG * 0.6;
    // Turning the wheel clockwise by X brings wheel angle -X under the pointer.
    const target = (360 - ((index + 0.5) * SLICE_DEG + wiggle) + 360) % 360;
    const now = ((rotation % 360) + 360) % 360;
    rotation += (5 + Math.floor(Math.random() * 3)) * 360 + ((target - now + 360) % 360);
    canvas.style.transform = `rotate(${rotation}deg)`;

    setTimeout(() => {
      spinning = false;
      hub.disabled = false;
      show(SLICES[index].kind);
    }, SPIN_MS + 100);
  }

  // ---------- result ----------
  let kind = 'truth';
  let lastPrompt = '';
  function pickPrompt() {
    const list = kind === 'truth' ? TRUTHS : DARES;
    let p;
    do { p = list[Math.floor(Math.random() * list.length)]; } while (p === lastPrompt);
    lastPrompt = p;
    $('prompt').textContent = p;
  }

  function show(k) {
    kind = k;
    $('card').className = `card ${k}`;
    $('emoji').textContent = k === 'truth' ? '🤔' : '🔥';
    $('kind').textContent = k === 'truth' ? 'TRUTH!' : 'DARE!';
    $('who').textContent = players.length ? `${players[turn]}, your turn!` : 'Your turn!';
    pickPrompt();
    overlay.classList.add('open');
    $('done').focus();
  }

  function done() {
    overlay.classList.remove('open');
    confetti();
    if (players.length) turn = (turn + 1) % players.length;
    render();
    hub.focus();
  }

  function confetti() {
    const colors = ['#ff5fa2', '#ff9f1c', '#ffd23f', '#3ddc97', '#3bc9ff', '#9b5de5'];
    for (let i = 0; i < 60; i++) {
      const bit = document.createElement('div');
      bit.className = 'confetti';
      bit.style.left = `${Math.random() * 94}vw`;
      bit.style.background = colors[i % colors.length];
      bit.style.animationDuration = `${1.5 + Math.random() * 1.5}s`;
      bit.style.animationDelay = `${Math.random() * 0.3}s`;
      document.body.append(bit);
      bit.addEventListener('animationend', () => bit.remove());
    }
  }

  // ---------- players ----------
  const chipColors = ['#ffd23f', '#3bc9ff', '#ff9f1c', '#3ddc97', '#ff5fa2', '#9b5de5'];
  function render() {
    const chips = $('chips');
    chips.innerHTML = '';
    players.forEach((name, i) => {
      const chip = document.createElement('span');
      chip.className = 'chip' + (i === turn ? ' now' : '');
      chip.style.background = chipColors[i % chipColors.length];
      chip.append(document.createTextNode(name));
      const x = document.createElement('button');
      x.type = 'button';
      x.textContent = '×';
      x.setAttribute('aria-label', `Remove ${name}`);
      x.addEventListener('click', () => {
        players.splice(i, 1);
        if (i < turn) turn--;
        if (turn >= players.length) turn = 0;
        savePlayers();
        render();
      });
      chip.append(x);
      chips.append(chip);
    });
    $('none').hidden = players.length > 0;

    const t = $('turn');
    t.textContent = players.length ? `${players[turn]}'s turn! 🎯` : 'Tap 67 to spin!';
  }

  $('addForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const name = $('name').value.trim();
    if (!name) return;
    players.push(name);
    $('name').value = '';
    savePlayers();
    render();
  });

  hub.addEventListener('click', spin);
  $('done').addEventListener('click', done);
  $('again').addEventListener('click', pickPrompt);
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && overlay.classList.contains('open')) done();
  });

  // Redraw once the playful font has loaded so the wheel labels use it too.
  drawWheel();
  if (document.fonts) document.fonts.ready.then(drawWheel);
  render();
})();
</script>
</body>
</html>
